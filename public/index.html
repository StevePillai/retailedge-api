<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RetailEdge</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; }
    li { margin: 0.4rem 0; }
    code { background: #eee; padding: 0.1em 0.4em; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>RetailEdge Store</h1>
  <p>Deployed version: <code id="version">loading...</code></p>
  <h2>Products</h2>
  <ul id="products"></ul>
  <script>
    fetch('/health').then(r => r.json()).then(d => {
      document.getElementById('version').textContent = d.version;
    });
    fetch('/api/products').then(r => r.json()).then(items => {
      document.getElementById('products').innerHTML =
        items.map(p => '<li>' + p.name + ': Rs ' + p.price + '</li>').join('');
    });
  </script>
</body>
</html>
