name: Trigger Jenkins Deploy

on:
  push:
    branches: [main]

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins Pipeline
        run: |
          curl -fsS -X POST \
            --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }}" \
            "${{ secrets.JENKINS_URL }}/job/retailedge-deploy/buildWithParameters" \
            --data "COMMIT_SHA=${{ github.sha }}" \
            --data "ENV=staging"
