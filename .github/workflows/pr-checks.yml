name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm test -- --coverage

      - name: Docker build smoke test
        run: docker build -t smoke-test:pr .

      - name: Trivy security scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'smoke-test:pr'
          exit-code: '1'
          severity: 'CRITICAL'
